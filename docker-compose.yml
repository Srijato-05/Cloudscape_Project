# ==============================================================================
# CLOUDSCAPE CORE 5.2 - ENTERPRISE INFRASTRUCTURE MESH (ULTIMATELY ADVANCED)
# ==============================================================================
# Compose V2 Specification
# Provisions the Graph Intelligence Database, State Differentials Cache, 
# and the Multi-Cloud API Simulators (Standard LocalStack & Azurite).
# Optimized for high-throughput synthetic topology generation (100k+ nodes).
# ==============================================================================

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "50m"
    max-file: "5"

services:
  # ------------------------------------------------------------------------------
  # 1. NEO4J GRAPH INTELLIGENCE ENGINE (GDS + APOC ENTERPRISE)
  # ------------------------------------------------------------------------------
  neo4j-gds:
    image: neo4j:5.17.0-enterprise
    container_name: cloudscape_neo4j_engine
    hostname: neo4j-engine
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "7474:7474" # HTTP Browser UI
      - "7687:7687" # High-Speed Bolt Protocol
    environment:
      # Licensing & Auth
      - NEO4J_ACCEPT_LICENSE_AGREEMENT=yes
      - NEO4J_AUTH=${NEO4J_AUTH:-neo4j/Cloudscape2026!}
      
      # Advanced Plugin Auto-Provisioning
      - NEO4J_PLUGINS=["apoc", "graph-data-science"]
      - NEO4J_apoc_export_file_enabled=true
      - NEO4J_apoc_import_file_enabled=true
      - NEO4J_apoc_import_file_use__neo4j__config=true
      
      # JVM Memory Tuning (High Performance for topological mutations)
      - NEO4J_dbms_memory_heap_initial__size=${NEO4J_HEAP_INITIAL:-2G}
      - NEO4J_dbms_memory_heap_max__size=${NEO4J_HEAP_MAX:-4G}
      - NEO4J_dbms_memory_pagecache_size=${NEO4J_PAGECACHE:-1G}
      
      # Database Security & Routing
      - NEO4J_dbms_default__database=neo4j
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*,gds.*
      - NEO4J_dbms_security_procedures_allowlist=apoc.*,gds.*
    volumes:
      - ./volume/neo4j_data:/data
      - ./volume/neo4j_logs:/logs
      - ./volume/neo4j_import:/var/lib/neo4j/import
      - ./volume/neo4j_plugins:/plugins
    networks:
      - cloudscape_mesh
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *default-logging

  # ------------------------------------------------------------------------------
  # 2. REDIS STATE DIFFERENTIAL CACHE (LUA HARDENED)
  # ------------------------------------------------------------------------------
  redis-cache:
    image: redis:7.2-alpine
    container_name: cloudscape_redis_cache
    hostname: redis-cache
    restart: unless-stopped
    command: >
      --save 60 1
      --loglevel warning
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - ./volume/redis_data:/data
    networks:
      - cloudscape_mesh
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    logging: *default-logging

  # ------------------------------------------------------------------------------
  # 3. LOCALSTACK STANDARD (AWS API SIMULATOR V3)
  # ------------------------------------------------------------------------------
  localstack-aws:
    image: localstack/localstack:latest
    container_name: cloudscape_localstack_aws
    hostname: localstack-aws
    restart: unless-stopped
    ports:
      - "4566:4566"            # LocalStack Gateway
      - "4510-4559:4510-4559"  # External services port range
    environment:
      # Explicit Service Boot to preserve RAM and eliminate socket drops
      - SERVICES=iam,s3,ec2,rds,sts
      - DEBUG=${DEBUG:-0}
      - ENFORCE_IAM=1          # Enabled for high-fidelity simulation
      - PERSISTENCE=1          # Enabled for forensic timeline data
      - DOCKER_HOST=unix:///var/run/docker.sock
      - AWS_DEFAULT_REGION=us-east-1
    volumes:
      - ./volume/localstack:/var/lib/localstack
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - cloudscape_mesh
    healthcheck:
      test: ["CMD", "curl", "-s", "http://localhost:4566/_localstack/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *default-logging

  # ------------------------------------------------------------------------------
  # 4. AZURITE (AZURE STORAGE SIMULATOR - VERSION ABSTRACTION)
  # ------------------------------------------------------------------------------
  azurite-azure:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    container_name: cloudscape_azurite_azure
    hostname: azurite-azure
    restart: unless-stopped
    command: "azurite --loose --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0 --location /data --debug /data/debug.log --skipApiVersionCheck"
    ports:
      - "10000:10000" # Blob Service
      - "10001:10001" # Queue Service
      - "10002:10002" # Table Service
    environment:
      - AZURE_DISABLE_TELEMETRY=1
    volumes:
      - ./volume/azure_data:/data
    networks:
      - cloudscape_mesh
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "10000"]
      interval: 10s
      timeout: 5s
      retries: 3
    logging: *default-logging

  # ------------------------------------------------------------------------------
  # 5. CORE ORCHESTRATOR (BACKEND - FORENSIC MODE)
  # ------------------------------------------------------------------------------
  core-orchestrator:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cloudscape_core_orchestrator
    depends_on:
      neo4j-gds:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
    environment:
      - NEO4J_URI=bolt://neo4j-engine:7687
      - REDIS_URL=redis://redis-cache:6379/0
      - AWS_ENDPOINT_URL=http://localstack-aws:4566
      - ENVIRONMENT=local_simulation
      - PYTHONUNBUFFERED=1
    volumes:
      - ./backend/config:/app/config:ro
      - ./backend/data:/app/data
      - ./forensics:/app/forensics
    networks:
      - cloudscape_mesh
    logging: *default-logging

# ==============================================================================
# ISOLATED NETWORK TOPOLOGY (HIGH-FIDELITY SEGMENTATION)
# ==============================================================================
networks:
  cloudscape_mesh:
    name: cloudscape_mesh
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
          gateway: 172.28.0.1