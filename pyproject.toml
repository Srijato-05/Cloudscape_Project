[tool.poetry]
name = "cloudscape-forensic-engine"
version = "5.2.0"
description = "The Enterprise Multi-Cloud Intelligence Mesh. Advanced Forensic Discovery & Graph-Theoretic Path Analysis."
authors = ["Cloudscape Core Team <security@cloudscape.io>"]
license = "Proprietary"
readme = "README.md"
homepage = "https://cloudscape.io"
repository = "https://github.com/cloudscape/forensic-engine"
keywords = ["forensics", "cloud-security", "graph-theory", "blast-radius", "autonomous"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "Programming Language :: Python :: 3.12"
]
package-mode = true
packages = [
    { include = "backend" }
]

[tool.poetry.dependencies]
python = "^3.11, <3.14"

# === SECTION A: CRYPTOGRAPHY, SECURITY & TRUST ===
cryptography = ">=46.0.0"
pyOpenSSL = ">=25.3.0"
certifi = "==2026.2.25"

# === SECTION B: GRAPH INTELLIGENCE & DISCOVERY MATRICES ===
neo4j = ">=6.1.0"
redis = "==7.3.0"
aiohttp = "==3.13.3"
aiosignal = "==1.4.0"
networkx = "==3.6.1"
pyvis = "==0.3.2"

# === SECTION C: CLOUD EXTRACTION FABRICS (AWS) ===
boto3 = "==1.42.68"
botocore = "==1.42.68"
s3transfer = "==0.16.0"
jmespath = "==1.1.0"

# === SECTION D: CLOUD EXTRACTION FABRICS (AZURE) ===
azure-core = "==1.38.3"
azure-identity = "==1.25.3"
azure-common = "==1.1.28"
azure-mgmt-core = "==1.6.0"
msal = "==1.35.1"
msal-extensions = "==1.3.1"
msrest = "==0.7.1"
azure-mgmt-authorization = "==4.0.0"
azure-mgmt-resource = "==25.0.0"
azure-mgmt-compute = "==37.2.0"
azure-mgmt-network = "==30.2.0"
azure-mgmt-containerservice = "==40.2.0"
azure-mgmt-cosmosdb = "==9.9.0"
azure-mgmt-keyvault = "==13.0.0"
azure-mgmt-sql = "==3.0.1"
azure-mgmt-storage = "==21.1.0"
azure-storage-blob = "==12.28.0"

# === SECTION E: DATA VALIDATION & SERIALIZATION ===
pydantic = "==2.12.5"
pydantic-settings = "==2.13.1"
pydantic_core = "==2.41.5"
python-dotenv = "==1.2.2"
PyYAML = "==6.0.3"
toml = "==0.10.2"
pycparser = "==3.0"
jsonschema = "==4.26.0"
jsonpickle = "==4.1.1"

# === SECTION F: DATA SCIENCE, ML & INTELLIGENCE ===
numpy = "==1.26.4"
pandas = "==2.3.3"
scikit-learn = "==1.8.0"
pyarrow = "==23.0.1"
narwhals = "==2.17.0"
sympy = ">=1.13.0"
mpmath = ">=1.3.0"

# === SECTION G: ANALYST HUB & VISUALIZATION ===
streamlit = "==1.55.0"
plotly = "==6.6.0"
altair = "==6.0.0"
pydeck = "==0.9.1"
rich = "==14.3.3"
Pygments = "==2.19.2"
colorama = ">=0.4.6"
prompt_toolkit = "==3.0.52"
click = "==8.3.1"
blinker = "==1.9.0"

# === SECTION H: UTILITIES, GIT & INTERNALS ===
GitPython = "==3.1.46"
Jinja2 = "==3.1.6"
markdown-it-py = "==4.0.0"
watchdog = "==4.0.0"
tenacity = "==8.5.0"
python-dateutil = "==2.9.0.post0"
requests = "==2.32.5"
httpx = "==0.27.0"
urllib3 = "==2.6.3"
attrs = "==25.4.0"
cachetools = "==5.5.2"
pillow = "==10.4.0"
protobuf = "==4.25.8"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.23.5"
pytest-cov = "^4.1.0"
moto = {extras = ["all"], version = "^5.0.0"}
pyright = "^1.1.350"
ruff = "^0.3.0"
black = "^24.2.0"

[tool.poetry.scripts]
cloudscape = "backend.main:main"
verify = "backend.tests.verify_advanced:run_verify"

[tool.pyright]
include = ["backend"]
exclude = ["**/node_modules", "**/__pycache__", "venv", ".venv"]
venvPath = "D:\\Cloudscape_Project"
venv = ".venv"
extraPaths = ["backend/src"]
typeCheckingMode = "basic"

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --cov=backend/src"
testpaths = ["backend/tests"]
asyncio_mode = "auto"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
